name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: follow
          POSTGRES_PASSWORD: follow
          POSTGRES_DB: follow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U follow -d follow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://follow:follow@localhost:5432/follow_test
      DATABASE_TEST_URL: postgres://follow:follow@localhost:5432/follow_test
      JWT_SECRET: ci-secret-with-at-least-32-characters
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migraciones
        run: npx node-pg-migrate up -m src/infra/db/migrations -j sql
      - name: Seeds
        run: npx tsx src/infra/db/seeds/seed.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
